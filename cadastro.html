<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar - RecifeHub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark: #06202b;
      --cyan: #19eee2;
      --gray: #718087;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #06202b, #123a47);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .container {
      width: 940px;
      max-width: 100%;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 38% 62%;
      box-shadow: 0 15px 45px rgba(0,0,0,.3);
    }

    .welcome {
      background: var(--dark);
      color: white;
      padding: 45px 38px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      color: var(--cyan);
      font-size: 29px;
      font-weight: bold;
      margin-bottom: 45px;
    }

    .welcome h1 {
      font-size: 30px;
      line-height: 1.2;
      margin-bottom: 17px;
    }

    .welcome h1 span { color: var(--cyan); }

    .welcome p {
      color: #d7e2e5;
      line-height: 1.5;
      font-size: 14px;
    }

    .register {
      padding: 38px 45px;
      color: #263d46;
    }

    .register h2 {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: var(--gray);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      height: 42px;
      border: 1px solid #d3dadd;
      border-radius: 7px;
      padding: 0 12px;
      font-size: 13px;
      outline: none;
      margin-bottom: 14px;
      background: white;
    }

    input:focus, select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(25,238,226,.15);
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 3px 0 18px;
      font-size: 11px;
      color: #718087;
      line-height: 1.4;
    }

    .terms input {
      width: 15px;
      height: 15px;
      margin: 0;
      flex-shrink: 0;
    }

    .terms a {
      color: #00aaa1;
    }

    .btn {
      width: 100%;
      height: 44px;
      background: var(--cyan);
      color: #06303a;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover { filter: brightness(.93); }

    .login-link {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--gray);
    }

    .login-link a {
      color: #00aaa1;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
    }

    .back a {
      color: #53666d;
      text-decoration: none;
    }

    @media (max-width: 700px) {
      .container { grid-template-columns: 1fr; }
      .welcome { padding: 30px; }
      .logo { margin-bottom: 25px; }
      .register { padding: 30px; }
      .row { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>

  <div class="container">

    <section class="welcome">
      <div class="logo">⌘ RecifeHub</div>

      <h1>Faça parte do<br><span>RecifeHub.</span></h1>

      <p>
        Crie sua conta para publicar projetos,
        encontrar oportunidades e colaborar com
        novas ideias para transformar nossa cidade.
      </p>
    </section>

    <section class="register">
      <h2>Criar conta</h2>
      <p class="subtitle">Preencha os dados para começar</p>

      <form onsubmit="cadastrar(event)">

        <div class="row">
          <div>
            <label for="nome">Nome completo</label>
            <input
              type="text"
              id="nome"
              placeholder="Seu nome"
              required
            >
          </div>

          <div>
            <label for="usuario">Nome de usuário</label>
            <input
              type="text"
              id="usuario"
              placeholder="Nome de usuário"
              required
            >
          </div>
        </div>

        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          placeholder="seuemail@exemplo.com"
          required
        >

        <div class="row">
          <div>
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              placeholder="Crie uma senha"
              minlength="6"
              required
            >
          </div>

          <div>
            <label for="confirmar">Confirmar senha</label>
            <input
              type="password"
              id="confirmar"
              placeholder="Repita sua senha"
              minlength="6"
              required
            >
          </div>
        </div>

        <label for="tipo">Tipo de usuário</label>
        <select id="tipo" required>
          <option value="">Selecione uma opção</option>
          <option value="pessoa">Pessoa</option>
          <option value="estudante">Estudante</option>
          <option value="pesquisador">Pesquisador</option>
          <option value="instituicao">Instituição</option>
        </select>

        <label class="terms">
          <input type="checkbox" id="termos" required>
          <span>
            Concordo com os <a href="#">Termos de Uso</a>
            e a <a href="#">Política de Privacidade</a>.
          </span>
        </label>

        <button class="btn" type="submit">Criar minha conta</button>
      </form>

      <p class="login-link">
        Já possui uma conta?
        <a href="login.html">Entrar</a>
      </p>

      <div class="back">
        <a href="index.html">← Voltar para o início</a>
      </div>
    </section>

  </div>

  <script>
    function cadastrar(event) {
      event.preventDefault();

      const senha = document.getElementById("senha").value;
      const confirmar = document.getElementById("confirmar").value;

      if (senha !== confirmar) {
        alert("As senhas não são iguais.");
        return;
      }

      alert("Cadastro realizado com sucesso!");
    }
  </script>

</body>
</html>
