<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - RecifeHub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark: #06202b;
      --dark2: #0d2c38;
      --cyan: #19eee2;
      --white: #fff;
      --gray: #718087;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #06202b, #123a47);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
    }

    .container {
      width: 900px;
      max-width: 92%;
      min-height: 540px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(0,0,0,.3);
    }

    .welcome {
      background: var(--dark);
      padding: 55px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      color: var(--cyan);
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 45px;
    }

    .welcome h1 {
      font-size: 34px;
      margin-bottom: 18px;
    }

    .welcome h1 span { color: var(--cyan); }

    .welcome p {
      color: #d6e1e4;
      line-height: 1.5;
      font-size: 15px;
    }

    .login {
      color: #263d46;
      padding: 50px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login h2 {
      font-size: 29px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--gray);
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
      display: block;
    }

    input {
      width: 100%;
      height: 45px;
      border: 1px solid #d3dadd;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 14px;
      margin-bottom: 17px;
      outline: none;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(25,238,226,.15);
    }

    .forgot {
      text-align: right;
      color: #00aaa1;
      font-size: 12px;
      margin-top: -8px;
      margin-bottom: 22px;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      height: 45px;
      border: 0;
      border-radius: 8px;
      background: var(--cyan);
      color: #06303a;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover { filter: brightness(.93); }

    .register {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--gray);
    }

    .register a {
      color: #00aaa1;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
    }

    .back a {
      color: #53666d;
      text-decoration: none;
    }

    @media (max-width: 700px) {
      .container { grid-template-columns: 1fr; }
      .welcome { padding: 30px; min-height: 220px; }
      .logo { margin-bottom: 20px; }
      .welcome h1 { font-size: 27px; }
      .login { padding: 35px 30px; }
    }
  </style>
</head>
<body>

  <div class="container">

    <section class="welcome">
      <div class="logo">⌘ RecifeHub</div>

      <h1>Bem-vindo ao<br><span>RecifeHub.</span></h1>

      <p>
        Entre na sua conta para acompanhar projetos,
        compartilhar ideias e se conectar com pessoas
        e instituições do Recife.
      </p>
    </section>

    <section class="login">
      <h2>Entrar</h2>
      <p class="subtitle">Acesse sua conta do RecifeHub</p>

      <form onsubmit="entrar(event)">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          placeholder="Digite seu e-mail"
          required
        >

        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          placeholder="Digite sua senha"
          required
        >

        <div class="forgot">Esqueceu sua senha?</div>

        <button class="btn" type="submit">Entrar</button>
      </form>

      <p class="register">
        Ainda não possui uma conta?
        <a href="cadastro.html">Cadastre-se</a>
      </p>

      <div class="back">
        <a href="index.html">← Voltar para o início</a>
      </div>
    </section>

  </div>

  <script>
async function entrar(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    try {
        const resposta = await fetch("http://127.0.0.1:5000/api/login", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            credentials: "include",

            body: JSON.stringify({
                email: email,
                senha: senha
            })
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
            alert(resultado.erro);
            return;
        }

        alert("Bem-vindo, " + resultado.usuario.nome + "!");

    } catch (erro) {
        console.error("Erro:", erro);
        alert("Não foi possível conectar ao servidor.");
    }
}
  </script>

</body>
</html>
